<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpecSpy | Smart Glasses Tracker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;

background:linear-gradient(-45deg,#2563eb,#4f46e5,#06b6d4,#3b82f6);

background-size:400% 400%;

animation:bg 12s ease infinite;

display:flex;
flex-direction:column;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

nav{

display:flex;
justify-content:space-between;
align-items:center;

padding:25px 70px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

}

.logo{

font-size:34px;
font-weight:bold;
color:white;

}

nav ul{

display:flex;
list-style:none;

}

nav ul li{

margin-left:35px;

}

nav ul li a{

text-decoration:none;
color:white;
font-size:18px;
transition:.3s;

}

nav ul li a:hover{

color:#ffd54f;

}

.hero{

flex:1;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

}

.card{

width:900px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.3);

border-radius:25px;

padding:60px;

text-align:center;

box-shadow:0 20px 50px rgba(0,0,0,.25);

}

.card h1{

font-size:60px;

color:white;

margin-bottom:20px;

}

.card h2{

font-size:34px;

color:#ffe082;

margin-bottom:25px;

}

.card p{

font-size:22px;

line-height:1.7;

color:white;

margin-bottom:45px;

}

.buttons{

display:flex;

justify-content:center;

gap:25px;

flex-wrap:wrap;

}

.btn{

padding:16px 42px;

font-size:20px;

border-radius:50px;

text-decoration:none;

transition:.3s;

font-weight:bold;

}

.primary{

background:white;

color:#2563eb;

}

.primary:hover{

transform:translateY(-5px);

box-shadow:0 10px 25px rgba(0,0,0,.3);

}

.secondary{

background:transparent;

border:2px solid white;

color:white;

}

.secondary:hover{

background:white;

color:#2563eb;

}

.features{

margin-top:45px;

display:flex;

justify-content:center;

gap:40px;

flex-wrap:wrap;

color:white;

font-size:18px;

font-weight:bold;

}

.feature{

background:rgba(255,255,255,.1);

padding:18px 28px;

border-radius:15px;

}

</style>

</head>

<body>

<nav>

<div class="logo">
👓 SpecSpy

</div>

<ul>

<li><a href="/">Home</a></li>

<li><a href="/login">Login</a></li>

<li><a href="/register">Register</a></li>

</ul>

</nav>

<section class="hero">

<div class="card">

<h1>👓 FindEye</h1>

<h2>Smart Bluetooth Glasses Tracker</h2>

<p>
    Can't find your glasses?
    FindEye helps you locate and ring them easily.
</p>

<div class="buttons">

<a href="/login" class="btn primary">

🚀 Get Started

</a>

<a href="/register" class="btn secondary">

Create Account

</a>

</div>

<div class="features">

<div class="feature">
📶 Bluetooth Tracking
</div>

<div class="feature">
🔔 Ring Glasses
</div>

<div class="feature">
📍 Last Known Location
</div>

<div class="feature">
🔋 Battery Monitoring
</div>

</div>

</div>

</section>

</body>

</html>
