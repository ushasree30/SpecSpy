<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpecSpy | Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(-45deg,#2563eb,#4f46e5,#06b6d4,#3b82f6);

background-size:400% 400%;

animation:bg 12s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.login-box{

width:430px;

padding:45px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.3);

border-radius:25px;

box-shadow:0 20px 45px rgba(0,0,0,.25);

text-align:center;

}

.logo{

font-size:50px;

margin-bottom:10px;

}

h2{

color:white;

margin-bottom:10px;

font-size:34px;

}

.subtitle{

color:#f5f5f5;

margin-bottom:30px;

font-size:17px;

}

.error{

color:#ffeb3b;

font-weight:bold;

margin-bottom:15px;

}

input{

width:100%;

padding:15px;

margin:12px 0;

border:none;

outline:none;

border-radius:12px;

font-size:17px;

}

button{

width:100%;

padding:15px;

margin-top:15px;

background:white;

color:#2563eb;

border:none;

border-radius:50px;

font-size:20px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-4px);

box-shadow:0 10px 20px rgba(0,0,0,.25);

}

p{

margin-top:25px;

color:white;

}

a{

color:#ffe082;

font-weight:bold;

text-decoration:none;

}

a:hover{

text-decoration:underline;

}

.home{

display:inline-block;

margin-top:20px;

color:white;

text-decoration:none;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
👓
</div>

<h2>SpecSpy Login</h2>

<p class="subtitle">
Welcome Back
</p>

<p class="error" th:text="${error}"></p>

<form action="/loginUser" method="post">

<input
type="email"
name="email"
placeholder="📧 Enter Email"
required>

<input
type="password"
name="password"
placeholder="🔒 Enter Password"
required>

<button type="submit">
🚀 Login
</button>

</form>

<p>

Don't have an account?

<a href="/register">

Create Account

</a>

</p>

<a href="/" class="home">

🏠 Back to Home

</a>

</div>

</body>

</html>
