<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SpecSpy | Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(-45deg,#2563eb,#4f46e5,#06b6d4,#3b82f6);

background-size:400% 400%;

animation:bg 12s ease infinite;

min-height:100vh;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

nav{

display:flex;

justify-content:space-between;

align-items:center;

padding:22px 60px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(20px);

color:white;

}

.logo{

font-size:34px;

font-weight:bold;

}

.back{

padding:12px 25px;

background:#6c757d;

color:white;

text-decoration:none;

border-radius:30px;

transition:.3s;

}

.back:hover{

background:#495057;

transform:translateY(-3px);

}

.container{

width:92%;

max-width:800px;

margin:40px auto;

}

.card{

background:rgba(255,255,255,.15);

backdrop-filter:blur(20px);

border-radius:25px;

padding:40px;

color:white;

box-shadow:0 15px 30px rgba(0,0,0,.25);

}

.card h1{

text-align:center;

margin-bottom:35px;

font-size:40px;

}

.info{

width:100%;

border-collapse:collapse;

}

.info td{

padding:18px;

border-bottom:1px solid rgba(255,255,255,.25);

font-size:20px;

}

.label{

font-weight:bold;

width:260px;

}

.value{

font-weight:bold;

}

.green{

color:#7CFC00;

}
.red{

color:#ff7675;

}

.blue{

color:#81d4fa;

}

.button-area{

text-align:center;

margin-top:35px;

}

.edit-btn{

display:inline-block;

padding:15px 35px;

background:#0d6efd;

color:white;

text-decoration:none;

border-radius:50px;

font-size:20px;

font-weight:bold;

margin-right:15px;

transition:.3s;

}

.edit-btn:hover{

background:#084298;

transform:translateY(-4px);

}

.dashboard-btn{

display:inline-block;

padding:15px 35px;

background:#6c757d;

color:white;

text-decoration:none;

border-radius:50px;

font-size:20px;

font-weight:bold;

transition:.3s;

}

.dashboard-btn:hover{

background:#495057;

transform:translateY(-4px);

}

</style>

</head>

<body>

<nav>

<div class="logo">

👓 FindEye

</div>

<a href="/dashboard" class="back">

⬅ Dashboard

</a>

</nav>

<div class="container">

<div class="card">

<h1>

👤 My Profile

</h1>

<table class="info">
    <tr>

<td class="label">
👤 Name
</td>

<td class="value blue" th:text="${name}">
Ushasree
</td>

</tr>

<tr>

<td class="label">
📧 Email
</td>

<td class="value" th:text="${email}">
ushasree@gmail.com
</td>

</tr>

<tr>

<td class="label">
📱 Phone
</td>

<td class="value" th:text="${phone}">
9876543210
</td>

</tr>

<tr>

<td class="label">
👓 Device
</td>

<td class="value blue" th:text="${deviceName}">
FindEye Smart Glasses
</td>

</tr>

<tr>

<td class="label">
📶 Bluetooth Status
</td>

<td class="value green" th:text="${status}">
🟢 Connected
</td>

</tr>

<tr>

<td class="label">
🔋 Battery
</td>

<td class="value" th:text="${battery}">
92%
</td>

</tr>

<tr>

<td class="label">
📡 Signal
</td>

<td class="value" th:text="${signal}">
Excellent
</td>

</tr>

</table>
<div class="button-area">

<a href="#" class="edit-btn">

✏ Edit Profile

</a>

<a href="/dashboard" class="dashboard-btn">

⬅ Back to Dashboard

</a>

</div>

</div>

</div>
</body>

</html>
